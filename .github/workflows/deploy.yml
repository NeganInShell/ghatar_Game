name: انتشار در گیت‌هاب پیجز 🚂

on:
  push:
    branches: [main]
    paths:
      - 'edu-game-frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edu-game-frontend
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب نود
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: edu-game-frontend/package-lock.json

      - name: نصب بسته‌ها
        run: npm ci

      - name: بیلد بازی
        run: npm run build

      - name: آپلود خروجی
        uses: actions/upload-pages-artifact@v3
        with:
          path: edu-game-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: انتشار
        id: deployment
        uses: actions/deploy-pages@v4
